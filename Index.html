<link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0e11;--card:#18181d;--ink:#f4f1ea;--mute:#8d8a96;--line:#2a2a32;--bd:#3d3d49;--acc:#d4ff3a;--acc2:#ff6a3d;--hl:#d4ff3a;--on:#0e0e11;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#efece4;--card:#fbf9f4;--ink:#111114;--mute:#6b6874;--line:#dcd7ca;--bd:#bdb7a8;--hl:#d9421a}}
:root[data-theme="light"]{--bg:#efece4;--card:#fbf9f4;--ink:#111114;--mute:#6b6874;--line:#dcd7ca;--bd:#bdb7a8;--hl:#d9421a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;min-height:100vh}
#app{max-width:480px;margin:0 auto;padding:26px 20px 56px}
h1,h2,.big,.secret,.game b,.game .ic{font-family:Anton,Impact,"Arial Narrow Bold",sans-serif;font-weight:400;text-transform:uppercase}
h1{font-size:76px;margin:10px 0 6px;line-height:.9;letter-spacing:-.5px}
h1 span{color:var(--hl)}
h2{font-size:44px;margin:6px 0 8px;line-height:1;letter-spacing:.3px}
p.sub{color:var(--mute);margin:0 0 20px;line-height:1.45;font-size:15px}
.grid{display:flex;flex-direction:column;gap:10px;margin:24px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:18px;margin-bottom:14px}
.game{margin:0;display:flex;align-items:center;gap:16px;width:100%;text-align:left;font:inherit;background:var(--c);color:#0e0e11;border:0;border-radius:28px;padding:22px 22px;cursor:pointer;position:relative;transition:transform .12s}
.game:active{transform:scale(.97)}
.game::after{content:"↗";font-size:28px;font-weight:700;margin-left:auto}
.game .ic{font-size:20px;opacity:.55;min-width:30px}
.game b{font-size:34px;line-height:1;display:block;letter-spacing:.3px}
.game span{font-size:13px;line-height:1.3;display:block;margin-top:6px;opacity:.75}
button{font:inherit;cursor:pointer}
.btn{background:var(--acc);color:var(--on);border:0;border-radius:999px;padding:16px 22px;font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;width:100%;margin-top:12px;transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--bd)}
.btn.blue{background:var(--acc2);color:#0e0e11}
.back{background:none;border:0;color:var(--mute);padding:4px 0;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin-bottom:8px}
input,select{font:inherit;padding:14px 16px;border-radius:16px;border:1px solid var(--bd);background:var(--bg);color:var(--ink);width:100%}
input:focus,select:focus{outline:2px solid var(--acc);outline-offset:1px}
.row{display:flex;gap:10px}.row .btn{width:auto;margin-top:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{background:transparent;border:1px solid var(--bd);border-radius:999px;padding:7px 14px;font-size:14px;color:var(--ink)}
.chip button{background:none;border:0;color:var(--mute);margin-left:4px;padding:0}
.chip.opt{padding:11px 18px;font-size:15px;font-weight:500}
.chip.opt.on{background:var(--acc);border-color:var(--acc);color:var(--on);font-weight:700}
.chip.opt:disabled{opacity:.3}
.big{font-size:190px;text-align:center;line-height:1;margin:8px 0 6px;color:var(--hl)}
.center{text-align:center}
.secret{font-size:46px;text-align:center;padding:36px 12px;border-radius:22px;background:var(--bg);border:1px dashed var(--bd);margin:16px 0;word-break:break-word;line-height:1.1;letter-spacing:.3px}
.warn{color:var(--hl)}
.list div{display:flex;justify-content:space-between;padding:13px 2px;border-bottom:1px solid var(--line);font-weight:500}
.list div:last-child{border:0}
.list b{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:24px;color:var(--hl)}
label{font-size:13px;color:var(--mute);display:block;margin:10px 0 6px}
.card>b{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
</style>
</head>

Object.assign(MIM,NAMES);
const QSO={...NAMES,'Animais':MIM['Animais'],'Profissões':MIM['Profissões']};
let qsoCats=['Personagens da Disney'];
function qsoToggle(k){const i=qsoCats.indexOf(k);i<0?qsoCats.push(k):qsoCats.splice(i,1);render()}
function qsoAll(){qsoCats=Object.keys(QSO);render()}
function qsoStart(){
 const sel=qsoCats.filter(k=>QSO[k]);if(!sel.length)return alert('Escolha pelo menos um tema.');
 stopT();const cat=pick(sel);
 g={view:'qso',phase:'play',cat,pool:shuffle(QSO[cat]),k:0,ok:0,skip:0,t:60};render();
 tmr=setInterval(()=>{g.t--;const e=$('#qt');if(e)e.textContent=g.t;if(g.t<=0){stopT();g.phase='end';try{navigator.vibrate&&navigator.vibrate(400)}catch(x){}render()}},1000);
}
function qsoNext(hit){hit?g.ok++:g.skip++;g.k++;if(g.k>=g.pool.length){stopT();g.phase='end'}render()}
function stopT(){clearInterval(tmr);tmr=null}
function mimPool(){return mimCats.flatMap(c=>(MIM[c]||[]).filter(w=>!mimUsed.includes(w)).map(w=>[c,w]))}
function mimDraw(){stopT();g.t=null;const p=mimPool();if(!p.length){g.cur=null;g.empty=true;render();return}const [c,w]=pick(p);mimUsed.push(w);g.cur=w;g.cat=c;g.show=false;g.empty=false;render()}
function mimToggle(k){const i=mimCats.indexOf(k);i<0?mimCats.push(k):mimCats.splice(i,1);render()}
function mimAll(){mimCats=Object.keys(MIM);render()}
function mimShow(){g.show=true;render()}
function mimReset(){mimUsed=[];g.empty=false;render()}
function startT(){
 stopT();g.t=60;render();
 tmr=setInterval(()=>{g.t--;const e=$('#tm');if(e)e.textContent=g.t>0?g.t+'s':'Acabou!';if(g.t<=0){stopT();try{navigator.vibrate&&navigator.vibrate(400)}catch(e){}}},1000);
}
function addP(){const i=$('#np');const n=i.value.trim();if(n&&roster.length<20&&!roster.includes(n)){roster.push(n);sel.push(n)}save();render();const x=$('#np');if(x)x.focus()}
function delP(i){const n=roster.splice(i,1)[0];sel=sel.filter(x=>x!==n);save();render()}
function toggleSel(i){const n=roster[i],k=sel.indexOf(n);k<0?sel.push(n):sel.splice(k,1);save();render()}
function selAll(){sel=[...roster];save();render()}
function selNone(){sel=[];save();render()}

function playersBox(){
 return `<div class="card"><b>Jogadores cadastrados</b> <span style="color:var(--mute)">(${roster.length})</span>
 <div class="row" style="margin-top:10px"><input id="np" placeholder="Nome" maxlength="16" onkeydown="if(event.key==='Enter')addP()"><button class="btn" onclick="addP()">+</button></div>
 <div class="chips">${roster.map((p,i)=>`<span class="chip">${esc(p)}<button onclick="delP(${i})">✕</button></span>`).join('')||'<span style="color:var(--mute);font-size:14px">Cadastre quem costuma jogar</span>'}</div></div>`;
}
function selectBox(){
 return `<div class="card"><b>Quem vai jogar?</b> <span style="color:var(--mute)">(${players.length} de ${roster.length})</span>
 <div class="chips">${roster.map((p,i)=>`<button class="chip opt${sel.includes(p)?' on':''}" onclick="toggleSel(${i})">${esc(p)}</button>`).join('')||'<span style="color:var(--mute);font-size:14px">Cadastre jogadores na tela inicial.</span>'}</div>
 <div class="row" style="margin-top:10px"><button class="btn alt" onclick="selAll()">Todos</button><button class="btn alt" onclick="selNone()">Nenhum</button>${roster.length?'':'<button class="btn alt" onclick="go(\'home\')">Ir para o início</button>'}</div></div>`;
}

function startImp(){
 fix();
 const n=players.length,s=cfg.size,G=s===1?1:cfg.groups,I=s===1?cfg.imp:n-G*s;
 const D=cfg.mode==='palavra'?WORDS:QUESTIONS,keys=Object.keys(D);
 const sel=cfg.cats.filter(k=>keys.includes(k));
 if(players.length<3)return alert('Precisa de pelo menos 3 jogadores.');
 if(!sel.length)return alert('Escolha pelo menos um tema.');
 const cat=pick(sel);
 const set=shuffle(pick(D[cat])),info={};
 shuffle(players.map((_,i)=>i)).forEach((p,k)=>{info[p]=k<I?{imp:true}:{imp:false,gi:s===1?0:Math.floor((k-I)/s)}});
 g={view:'reveal',mode:'imp',multi:sel.length>1,type:cfg.mode,cat,set,G,I,info,order:shuffle(players.map((_,i)=>i)),i:0,shown:false};render();
}
function startIto(){
 if(players.length<2)return alert('Precisa de pelo menos 2 jogadores.');
 const nums=shuffle(Array.from({length:100},(_,i)=>i+1)).slice(0,players.length);
 g={view:'reveal',mode:'ito',theme:pick(THEMES),nums,i:0,shown:false};render();
}
function show(){g.shown=true;render()}
function next(){
 g.i++;g.shown=false;
 if(g.i>=players.length){g.view=g.mode==='imp'?'impEnd':'itoEnd';g.open=false}
 render();
}
function open_(){g.open=true;render()}
function sortLetter(){
 const left=LETTERS.filter(l=>!g.used.includes(l));
 if(!left.length){g.cur='—';render();return}
 g.cur=pick(left);g.used.push(g.cur);render();
}

function render(){
 players=cur();
 const a=$('#app');let h='';
 const v=g.view||'home';
 if(v==='home'){
  h=`<h1>Desafios do <span>GG</span></h1><p class="sub">Escolha um desafio e bora jogar.</p><div class="grid">
  <button class="card game" style="--c:#d4ff3a" onclick="go('imp')"><div class="ic">01</div><div><b>Impostor</b><span>Todos sabem a palavra... menos um.</span></div></button>
  <button class="card game" style="--c:#ff6a3d" onclick="go('ito')"><div class="ic">02</div><div><b>Ito</b><span>Ordenem os números só com dicas.</span></div></button>
  <button class="card game" style="--c:#8fd3ff" onclick="go('letra')"><div class="ic">03</div><div><b>Sorteador de letra</b><span>Para Adedonha, Stop e afins.</span></div></button>
  <button class="card game" style="--c:#ff9ec7" onclick="go('mim')"><div class="ic">04</div><div><b>Mímica / Dicas</b><span>Sorteia palavras por tema.</span></div></button>
  <button class="card game" style="--c:#c9a6ff" onclick="go('qso')"><div class="ic">05</div><div><b>Quem sou eu</b><span>Adivinhe o nome na testa.</span></div></button></div>
  ${playersBox()}<p class="sub" style="font-size:13px">Seus jogadores ficam salvos neste aparelho e valem para todos os jogos.</p>`;
 }
 else if(v==='imp'){
  fix();
  const n=players.length,keys=Object.keys(cfg.mode==='palavra'?WORDS:QUESTIONS),all=keys.every(k=>cfg.cats.includes(k));
  let grp;
  if(n<3)grp='<p class="sub">Selecione pelo menos 3 jogadores.</p>';
  else{
   grp=`${opts([['1','Individual'],['2','Duplas',Math.floor((n-1)/2)<2],['3','Trios',Math.floor((n-1)/3)<2]],String(cfg.size),'setSize')}`;
   if(cfg.size===1)grp+=`<p class="sub" style="margin-top:12px">Todos (menos os impostores) recebem o mesmo segredo. Quantos impostores?</p>${opts(Array.from({length:Math.max(1,Math.floor((n-1)/2))},(_,k)=>[String(k+1),String(k+1)]),String(cfg.imp),'setImp')}`;
   else{const m=Math.min(4,Math.floor((n-1)/cfg.size));grp+=`<p class="sub" style="margin-top:12px">Quantos grupos?</p>${opts(Array.from({length:m-1},(_,k)=>[String(k+2),String(k+2)]),String(cfg.groups),'setGroups')}<p class="sub" style="margin-top:10px">Sobram <b>${n-cfg.groups*cfg.size}</b> impostor(es) atrapalhando.</p>`}
  }
  h=`<button class="back" onclick="go('home')">← Menu</button><h2>Impostor</h2>
  <div class="card"><b>Modo</b>${opts([['palavra','Palavra'],['pergunta','Pergunta']],cfg.mode,'setMode')}<p class="sub" style="margin:12px 0 0">${cfg.mode==='palavra'?'Cada grupo recebe uma palavra parecida e precisa achar seus parceiros. O impostor não recebe palavra.':'Cada grupo recebe uma pergunta parecida e precisa achar seus parceiros. O impostor recebe outra. Respondam em voz alta.'}</p></div>
  ${selectBox()}
  <div class="card"><b>Grupos e impostores</b>${grp}</div>
  <div class="card"><b>Temas</b><p class="sub" style="margin:4px 0 0">Escolha um ou mais. Cada rodada sorteia um deles, sem misturar.</p><div class="chips">${keys.map(k=>`<button class="chip opt${cfg.cats.includes(k)?' on':''}" onclick="toggleCat('${k}')">${k}</button>`).join('')}<button class="chip opt${all?' on':''}" onclick="doideira()">Doideira</button></div></div>
  <button class="btn" onclick="startImp()">Começar</button>`;
 }
 else if(v==='ito'){
  h=`<button class="back" onclick="go('home')">← Voltar</button><h2>Ito</h2>
  <p class="sub">Cada um recebe um número de 1 a 100. Deem dicas do tema sem falar números e ordenem do menor para o maior.</p>${selectBox()}
  <button class="btn blue" onclick="startIto()">Distribuir números</button>`;
 }
 else if(v==='reveal'){
  const pi=g.order?g.order[g.i]:g.i,name=esc(players[pi]);
  h=`<div class="center"><p class="sub">Jogador ${g.i+1} de ${players.length}</p>`;
  if(g.mode==='ito')h+=`<div class="card"><b>Tema:</b> ${g.theme}<br><span style="color:var(--mute);font-size:14px">1 = mínimo · 100 = máximo</span></div>`;
  if(g.mode==='imp')h+=`<div class="card"><b>Tema:</b> ${g.cat}</div>`;
  if(!g.shown){
   h+=`<h2>Passe para <span class="warn">${name}</span></h2><div class="secret">?</div><button class="btn" onclick="show()">Ver o meu segredo</button>`;
  }else{
   let txt,extra='';
   if(g.mode==='imp'){
    const f=g.info[pi],it=f.imp?null:g.set[f.gi];
    txt=g.type==='palavra'?(f.imp?'<span class="warn">VOCÊ É O IMPOSTOR </span>':it):`<span style="font-size:22px">${f.imp?g.set[g.G]:it}</span>`;
    if(!f.imp&&g.G>1)extra='<p class="sub">Descubra quem é seu parceiro de grupo sem revelar demais.</p>';
      }else txt=g.nums[g.i];
   h+=`<h2>${name}</h2><div class="secret">${txt}</div>${extra}<button class="btn alt" onclick="next()">Esconder e passar</button>`;
  }
  h+=`</div>`;
 }
 else if(v==='impEnd'){
  const nm=pred=>players.filter((_,i)=>pred(g.info[i])).map(esc).join(' + ');
  const grp=Array.from({length:g.G},(_,k)=>`<p>${g.G>1?'Grupo '+(k+1)+': ':''}${nm(f=>!f.imp&&f.gi===k)} → <b>${g.set[k]}</b></p>`).join('');
  h=`<div class="center"><h2>Todos já viram!</h2><div class="card"><b>Tema:</b> ${g.cat}</div><p class="sub">${g.type==='palavra'?'Deem dicas sem entregar a palavra, achem seus parceiros e descubram o impostor.':'Respondam em voz alta, achem seus parceiros e descubram o impostor.'}</p>
  ${g.open?`<div class="card"><p class="sub">Impostor(es)</p><div class="big" style="font-size:30px">${nm(f=>f.imp)}</div>${grp}${g.type==='pergunta'?'<p class="sub">Pergunta do impostor: <b>'+g.set[g.G]+'</b></p>':''}</div>`:`<button class="btn" onclick="open_()">Revelar</button>`}
  <button class="btn alt" onclick="startImp()">Nova rodada</button><button class="btn alt" onclick="go('home')">Menu</button></div>`;
 }
 else if(v==='itoEnd'){
  const ord=players.map((p,i)=>({p,n:g.nums[i]})).sort((a,b)=>a.n-b.n);
  h=`<div class="center"><h2>Hora de ordenar!</h2><div class="card"><b>${g.theme}</b></div><p class="sub">Deem dicas, posicionem-se do menor para o maior e depois revelem.</p></div>
  ${g.open?`<div class="card list">${ord.map(o=>`<div><span>${esc(o.p)}</span><b>${o.n}</b></div>`).join('')}</div><p class="center sub">Acertaram a ordem? </p>`:`<button class="btn" onclick="open_()">Revelar números</button>`}
  <button class="btn alt" onclick="startIto()">Nova rodada</button><button class="btn alt" onclick="go('home')">Menu</button>`;
 }
 else if(v==='mim'){
  const keys=Object.keys(MIM),all=keys.every(k=>mimCats.includes(k)),left=mimPool().length;
  let box;
  if(g.empty)box='<div class="secret" style="font-size:22px">Acabaram as palavras! </div>';
  else if(!g.cur)box='<div class="secret">?</div>';
  else if(!g.show)box='<div class="secret">?</div><button class="btn blue" onclick="mimShow()">Ver a palavra</button>';
  else box=`<p class="sub" style="margin:0">${g.cat}</p><div class="secret">${g.cur}</div>`;
  h=`<button class="back" onclick="go('home')">← Menu</button><h2>Mímica / Dicas</h2>
  <p class="sub">Faça mímica ou dê dicas sem falar a palavra. Quem acertar ganha o ponto!</p>
  <div class="card center">${box}<button class="btn" onclick="mimDraw()">Sortear palavra</button></div>
  <div class="card center"><p class="sub" style="margin:0">Cronômetro</p><div class="big" style="font-size:44px;margin:6px 0" id="tm">${g.t==null?'60s':(g.t>0?g.t+'s':'Acabou!')}</div><button class="btn alt" onclick="startT()">Iniciar 60s</button></div>
  <div class="card"><b>Temas</b><p class="sub" style="margin:4px 0 0">Escolha um ou mais. Restam ${left} palavras.</p><div class="chips">${keys.map(k=>`<button class="chip opt${mimCats.includes(k)?' on':''}" onclick="mimToggle('${k}')">${k}</button>`).join('')}<button class="chip opt${all?' on':''}" onclick="mimAll()">Doideira</button></div>
  <button class="btn alt" onclick="mimReset()">Zerar palavras usadas</button></div>`;
 }
 else if(v==='qso'){
  if(g.phase==='play')h=`<div class="center"><p class="sub">${g.cat} · <b id="qt">${g.t}</b>s · acertos ${g.ok}</p><div class="secret" style="font-size:54px;padding:64px 12px">${esc(g.pool[g.k])}</div><button class="btn" onclick="qsoNext(true)">Acertou</button><button class="btn alt" onclick="qsoNext(false)">Pular</button></div>`;
  else if(g.phase==='end')h=`<div class="center"><h2>Acabou o tempo!</h2><div class="big">${g.ok}</div><p class="sub">acertos · ${g.skip} pulos<br>Tema: ${g.cat}</p><button class="btn" onclick="qsoStart()">Jogar de novo</button><button class="btn alt" onclick="go('home')">Menu</button></div>`;
  else{
   const keys=Object.keys(QSO),all=keys.every(k=>qsoCats.includes(k));
   h=`<button class="back" onclick="go('home')">← Menu</button><h2>Quem sou eu</h2>
   <p class="sub">Segure o celular na testa sem olhar. Os outros veem o nome e dão dicas; você adivinha em 60 segundos.</p>
   <div class="card"><b>Temas</b><p class="sub" style="margin:4px 0 0">Escolha um ou mais. Cada rodada sorteia um deles.</p><div class="chips">${keys.map(k=>`<button class="chip opt${qsoCats.includes(k)?' on':''}" onclick="qsoToggle('${k}')">${k}</button>`).join('')}<button class="chip opt${all?' on':''}" onclick="qsoAll()">Doideira</button></div></div>
   <button class="btn" onclick="qsoStart()">Começar</button>`;
  }
 }
 else if(v==='letra'){
  h=`<button class="back" onclick="go('home')">← Voltar</button><h2>Sorteador de letra</h2>
  <div class="card"><div class="big">${g.cur||'?'}</div></div>
  <button class="btn" onclick="sortLetter()">Sortear</button>
  <p class="sub" style="margin-top:18px">Já saíram (${g.used.length}/${LETTERS.length})</p>
  <div class="chips">${g.used.map(l=>`<span class="chip">${l}</span>`).join('')}</div>
  <button class="btn alt" onclick="g.used=[];g.cur='';render()">Zerar letras</button>`;
 }
 a.innerHTML=h;
}
render();
</script>
</body>
</html>
